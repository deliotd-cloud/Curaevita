name: Deploy CuraeVita website

on:
  push:
    branches: [main]
    paths:
      - 'curaevita-website/**'
      - '.github/workflows/deploy-curaevita-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curaevita-website
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: curaevita-website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static website
        run: npm run build:github
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: curaevita-website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify participating search engines
        if: success()
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data '{"host":"curaevita.com","key":"6c82c7992f5b4df0a5a57b7a55d19f48","keyLocation":"https://curaevita.com/6c82c7992f5b4df0a5a57b7a55d19f48.txt","urlList":["https://curaevita.com/","https://curaevita.com/apps/","https://curaevita.com/guides/","https://curaevita.com/guides/symptom-diary-for-an-appointment/","https://curaevita.com/guides/medication-tracking-report/","https://curaevita.com/guides/protect-health-notes-on-android/","https://curaevita.com/press/"]}' \
            https://api.indexnow.org/indexnow
